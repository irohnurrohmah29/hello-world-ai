openapi: 3.1.0
info:
  title: Product Catalog API
  version: 1.0.0
  description: |
    REST API for the Iqlifar concept catalog. Seed price and stock are simulated,
    and the catalog does not yet have actual product photography.
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Products
paths:
  /health:
    get:
      summary: Check API liveness
      responses:
        "200":
          description: API process is responding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessHealth"
  /api/v1/products:
    get:
      tags: [Products]
      summary: List active products
      responses:
        "200":
          description: Products and returned item count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Products]
      summary: Create a product
      description: |
        Local exercise endpoint only. It has no authentication and must not be exposed
        publicly until admin authentication and authorization are implemented.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
            example:
              name: Example Fragrance
              brand: Example Brand
              category: fragrance
              description: Plain-text product description.
              price:
                amount: 99000
                currency: IDR
              images:
                - url: null
                  alt: Concept image placeholder
                  isPrimary: true
              variants:
                - id: example-50
                  name: Example
                  attributes:
                    sizeMl: 50
                  description: Variant description.
                  notes:
                    top: [Bergamot]
                    heart: [Jasmine]
                    base: [Musk]
                  stock: 10
      responses:
        "201":
          description: Product created atomically
          headers:
            Location:
              description: Relative URL of the created product
              schema:
                type: string
                example: /api/v1/products/example-fragrance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/products/{id}:
    get:
      tags: [Products]
      summary: Get product detail by slug
      parameters:
        - name: id
          in: path
          required: true
          description: Public product slug (for example, iqlifar)
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "403":
          $ref: "#/components/responses/OriginDenied"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    SuccessHealth:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          const: true
        message:
          type: string
        data:
          type: object
          required: [status]
          properties:
            status:
              const: ok
        meta:
          type: object
    SuccessEnvelope:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          const: true
        message:
          type: string
        data: {}
        meta:
          type: object
    ProductListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Product"
            meta:
              type: object
              required: [count]
              properties:
                count:
                  type: integer
                  minimum: 0
    ProductResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Product"
    Product:
      type: object
      required:
        - id
        - name
        - brand
        - category
        - description
        - price
        - images
        - variants
        - availability
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Product slug used by the detail endpoint.
          example: iqlifar
        name:
          type: string
        brand:
          type: string
        category:
          type: string
        description:
          type: string
        price:
          $ref: "#/components/schemas/Price"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
        availability:
          type: string
          enum: [in_stock, out_of_stock]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Price:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 1
          maximum: 100000000000
        currency:
          const: IDR
    ProductImage:
      type: object
      additionalProperties: false
      required: [url, alt, isPrimary]
      properties:
        url:
          type: [string, "null"]
          format: uri
          description: Must be HTTPS when present; null denotes a concept placeholder.
        alt:
          type: string
          minLength: 1
          maxLength: 200
        isPrimary:
          type: boolean
    ProductVariant:
      type: object
      additionalProperties: false
      required: [id, name, attributes, description, notes, stock]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 60
        name:
          type: string
        attributes:
          type: object
          additionalProperties: false
          required: [sizeMl]
          properties:
            sizeMl:
              type: integer
              minimum: 1
              maximum: 10000
        description:
          type: string
        notes:
          $ref: "#/components/schemas/Notes"
        stock:
          type: integer
          minimum: 0
          maximum: 1000000
    Notes:
      type: object
      additionalProperties: false
      required: [top, heart, base]
      properties:
        top:
          $ref: "#/components/schemas/NoteList"
        heart:
          $ref: "#/components/schemas/NoteList"
        base:
          $ref: "#/components/schemas/NoteList"
    NoteList:
      type: array
      minItems: 1
      maxItems: 12
      items:
        type: string
        minLength: 1
        maxLength: 60
    ProductInput:
      type: object
      additionalProperties: false
      required: [name, brand, category, description, price, images, variants]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        brand:
          type: string
          minLength: 1
          maxLength: 80
        category:
          type: string
          pattern: "^[a-z0-9-]+$"
          maxLength: 40
        description:
          type: string
          minLength: 1
          maxLength: 2000
        price:
          $ref: "#/components/schemas/Price"
        images:
          type: array
          minItems: 1
          maxItems: 8
          description: Exactly one image must have isPrimary true.
          items:
            $ref: "#/components/schemas/ProductImage"
        variants:
          type: array
          minItems: 1
          maxItems: 20
          description: Variant IDs must be unique within the product.
          items:
            $ref: "#/components/schemas/ProductVariant"
    Problem:
      type: object
      required: [type, title, status, detail, instance, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
  responses:
    ValidationError:
      description: Malformed JSON, non-object body, or schema validation error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Product slug or variant identifier already exists
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProductNotFound:
      description: Product slug does not exist or is inactive
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: JSON request body exceeds 100 KB
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: Request Content-Type must be application/json
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected internal error; details are not exposed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OriginDenied:
      description: Request Origin is not in the configured CORS allowlist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
